<section
  class="main-section flex items-center justify-center px-[4.5rem] py-8 max-[680px]:px-5"
  [class.main-section--with-navbar]="navbarShown"
>
  @if (!navbarShown) {
    <h1
      class="[--carousel-item-height:1.62em] flex flex-col items-center justify-center gap-y-0 max-w-[72rem] text-center text-[5rem] leading-[1.14] text-black max-[1100px]:max-w-[52rem] max-[1100px]:text-[4rem] max-[680px]:max-w-full max-[680px]:text-[3.5rem] max-[420px]:text-[3rem] max-[360px]:text-[2.6rem] motion-reduce:animate-none"
    >
      <span class="leading-[1.2]">Hi, I'm</span>
      <span
        class="hero-carousel block w-full max-w-full overflow-hidden text-main-accent h-[var(--carousel-item-height)]"
        [style.--active-index]="activeWordIndex()"
      >
        <span class="hero-carousel-track" [class.is-resetting]="isResetting()">
          @for (word of carouselItems; track $index) {
            <a class="hero-carousel-item" [href]="'#' + word.section">
              <span
                class="hero-carousel-text"
                [class.transition-opacity]="!isResetting()"
                [class.duration-500]="!isResetting()"
                [style.opacity]="activeWordIndex() === $index ? 1 : 0"
                [style.view-transition-name]="
                  activeWordIndex() === $index ? 'carousel-item-' + word.section : undefined
                "
              >
                {{ word.word }}
              </span>
            </a>
          }
        </span>
      </span>
    </h1>
  }
</section>
