<section
  id="developing"
  class="min-h-screen px-16 py-24 max-[680px]:px-6"
  aria-labelledby="developing-heading"
>
  <div class="mx-auto flex max-w-3xl flex-col gap-12">
    <header class="flex flex-col gap-3">
      <h2 id="developing-heading" class="m-0 text-6xl leading-none text-main-accent">
        Developing
      </h2>
      <h3 class="m-0 text-4xl leading-none text-black/55">
        Work
      </h3>
    </header>

    <div
      class="relative ml-1 flex flex-col gap-12 before:absolute before:top-5 before:bottom-5 before:left-0 before:w-[2px] before:bg-gray-300"
    >
      @for (experience of jobExperiences; track $index) {
        <app-job-experience
          [attr.data-work-org]="experience.orgName"
          [experience]="experience"
          [isVisible]="isExperienceVisible(experience.orgName)"
        ></app-job-experience>
      }
    </div>

    <section class="flex flex-col gap-8" aria-labelledby="projects-heading">
      <header>
        <h3 id="projects-heading" class="m-0 text-4xl leading-none text-black/55">
          Also, some stuff I made...
        </h3>
      </header>

      <div class="grid grid-cols-2 gap-4 max-[680px]:grid-cols-1">
        @for (project of projects; track $index) {
          <app-project-card [project]="project"></app-project-card>
        }
      </div>
    </section>
  </div>
</section>
