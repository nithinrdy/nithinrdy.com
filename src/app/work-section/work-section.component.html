<section
  id="work"
  class="min-h-screen px-16 py-24 max-[680px]:px-6"
  aria-labelledby="work-heading"
>
  <div class="mx-auto flex max-w-3xl flex-col gap-12">
    <header>
      <h2 id="work-heading" class="m-0 text-[clamp(3rem,8vw,5rem)] leading-none text-main-accent">
        Work
      </h2>
    </header>

    <div
      class="relative ml-1 flex flex-col gap-12 before:absolute before:top-5 before:bottom-5 before:left-0 before:w-[2px] before:bg-gray-300"
    >
      @for (experience of jobExperiences; track $index) {
        <app-job-experience
          [attr.data-work-org]="experience.orgName"
          [experience]="experience"
          [isVisible]="isExperienceVisible(experience.orgName)"
        ></app-job-experience>
      }
    </div>
  </div>
</section>
