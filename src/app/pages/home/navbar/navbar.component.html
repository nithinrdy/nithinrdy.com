@if (isShown) {
  <nav
    class="fixed inset-x-0 top-0 z-[8] flex justify-center px-16 py-4 pointer-events-none max-[420px]:px-3 max-md:hidden"
    aria-label="Primary"
  >
    <div
      class="flex max-w-[calc(100vw-2rem)] items-center gap-8 rounded-lg border border-black/10 bg-[#f0f0f0]/85 px-4 py-[0.6rem] shadow-2xl backdrop-blur-[14px] pointer-events-auto [scrollbar-width:none] max-[420px]:max-w-[calc(100vw-1.5rem)]"
    >
      <a href="#">
        <app-avatar></app-avatar>
      </a>
      @for (item of navItems; track item.section) {
        <a
          class="site-navbar-link"
          [class.is-active]="activeSection() === item.section"
          [attr.aria-current]="activeSection() === item.section ? 'location' : null"
          [href]="'#' + item.section"
        >
          <span
            class="inline-flex items-center"
            [style.view-transition-name]="'carousel-item-' + item.section"
          >
            {{ item.label }}
          </span>
        </a>
      }
    </div>
  </nav>
}
