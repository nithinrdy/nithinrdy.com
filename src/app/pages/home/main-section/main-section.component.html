<section class="main-section flex items-center justify-center px-[4.5rem] py-8 max-sm:px-5">
  @if (!navbarShown) {
    <div class="relative flex flex-col items-center">
      <h1
        class="[--carousel-item-height:1.62em] flex flex-col items-center justify-center gap-y-0 max-w-[72rem] text-center text-[5rem] leading-[1.14] text-black max-lg:max-w-[52rem] max-lg:text-[4rem] max-sm:max-w-full max-sm:text-[3rem] motion-reduce:animate-none"
      >
        <span class="leading-[1.2]">Hi, I'm</span>
        <span
          class="hero-carousel block w-full max-w-full overflow-hidden text-main-accent h-[var(--carousel-item-height)]"
          [style.--active-index]="activeWordIndex()"
        >
          <span class="hero-carousel-track" [class.is-resetting]="isResetting()">
            @for (word of carouselItems; track $index) {
              <a class="hero-carousel-item" [href]="'#' + word.section">
                <span
                  class="hero-carousel-text"
                  [class.transition-opacity]="!isResetting()"
                  [class.duration-500]="!isResetting()"
                  [style.opacity]="activeWordIndex() === $index ? 1 : 0"
                  [style.view-transition-name]="
                    activeWordIndex() === $index ? 'carousel-item-' + word.section : undefined
                  "
                >
                  {{ word.word }}
                </span>
              </a>
            }
          </span>
        </span>
      </h1>

      <div
        class="scroll-on-marker bottom-16 fixed inline-flex items-center gap-1 text-main-accent text-lg motion-reduce:!animate-none motion-reduce:!transform-none motion-reduce:!opacity-100"
      >
        <i class="bi bi-arrow-down text-lg mt-1 animate-bounce motion-reduce:animate-none"></i>
        <span>Wonder what's down here...</span>
      </div>
    </div>
  }
</section>
